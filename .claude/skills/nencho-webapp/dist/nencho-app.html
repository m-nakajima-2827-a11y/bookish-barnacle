<style>

@media (prefers-color-scheme: dark) {

}

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

main section, .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
h2 { font-size: 18px; margin: 0 0 4px; }

  main section { border: 0; padding: 0; }
  body { background: #fff; color: #000; font-size: 11px; }

}

<body>
<header class="appbar">
  <div class="brand">
    <strong>年末調整 一元管理</strong>
    <span class="badge" id="yearBadge">令和8年分</span>
  </div>
  <div class="emp-switch">
    <label for="empSelect" class="sr">従業員</label>
    <select id="empSelect"></select>
    <button class="btn" data-action="new-employee">＋ 従業員を追加</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<div class="layout">
  <main id="main" tabindex="-1"></main>
  <aside class="summary" id="summary" aria-live="polite"></aside>

<footer class="foot">
  入力データはこのブラウザ内（localStorage）にのみ保存されます。共有PCでは使用後に「データ管理」からバックアップを取り削除してください。
  マイナンバー（個人番号）は入力しない設計です。計算は国税庁「令和8年分 年末調整のしかた」に基づきますが、最終確認は担当者が行ってください。
</footer>

<script>
/*
 * 年末調整 計算エンジン（令和8年分）
 *
 * 国税庁「年末調整計算シート（令和８年用）」の計算ロジックを踏襲し、
 * 集計シート → 各申告書 → 計算シート（①〜㉞）を自動計算する。
 *
 * 出典（2026-11 確認）:
 *  - 給与所得控除 No.1410  https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm
 *  - 令和8年分 年末調整のしかた https://www.nta.go.jp/publication/pamph/gensen/nencho2026/01.htm
 *    （Ⅰ 変わった点 / 速算表・配偶者控除額一覧・基礎控除額表・特定親族特別控除額表・扶養控除額等の表 / 保険料控除）
 *  - 給与所得者で確定申告が必要な人 No.1900 https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1900.htm
 *
 * 法改正時は TABLES だけを書き換える（references/annual-update.md 参照）。
 * ブラウザでは window.Nencho、Node では require() で使える（UMD）。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Nencho = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ------------------------------------------------------------------
  // 1. 令和8年分の控除テーブル（法改正時はここを更新）
  // ------------------------------------------------------------------
  const TABLES = {
    year: 2026,
    label: '令和8年分',
    // 給与所得控除後の金額（別表第五の考え方を関数化。計算シート M17/AC17 と同一）
    salaryIncome: {
      noIncomeUpTo: 740999,          // 74万999円以下は 0（69.1万〜74.1万未満は「なし」）
      minDeduction: 740000,          // 最低保障額 74万円（令和8・9年分）
      fixedBands: [                  // 219.1万〜220万未満の固定額
        { upTo: 2192999, income: 1451000 },
        { upTo: 2195999, income: 1453000 },
        { upTo: 2199999, income: 1456000 },
      ],
      roundFrom: 2200000, roundTo: 6599999, roundUnit: 4000, // 220万〜660万未満は4,000円単位で切捨て
      maxSalary: 20000000,           // 2,000万円超は年末調整の対象外
    },
    // 基礎控除（合計所得金額の上限 → 控除額）
    basic: [
      [4890000, 1040000],   // 62万 + 特例加算42万
      [6550000, 670000],    // 62万 + 特例加算5万
      [23500000, 620000],
      [24000000, 480000],
      [24500000, 320000],
      [25000000, 160000],
      [Infinity, 0],
    ],
    // 配偶者（特別）控除：配偶者の合計所得金額の上限 → [A(本人900万以下), B(950万以下), C(1,000万以下)]
    spouseElderly: [480000, 320000, 160000], // 配偶者控除・老人控除対象配偶者（配偶者62万以下かつ70歳以上）
    spouse: [
      [620000, [380000, 260000, 130000]],   // 配偶者控除（一般）
      [950000, [380000, 260000, 130000]],   // 以下 配偶者特別控除
      [1000000, [360000, 240000, 120000]],
      [1050000, [310000, 210000, 110000]],
      [1100000, [260000, 180000, 90000]],
      [1150000, [210000, 140000, 70000]],
      [1200000, [160000, 110000, 60000]],
      [1250000, [110000, 80000, 40000]],
      [1300000, [60000, 40000, 20000]],
      [1330000, [30000, 20000, 10000]],
    ],
    spouseTaxpayerBands: [9000000, 9500000, 10000000], // 本人の合計所得金額 区分Ⅰ A/B/C
    // 特定親族特別控除（特定親族の合計所得金額の上限 → 控除額）。62万円以下は扶養控除（特定扶養親族）
    tokuteiShinzoku: [
      [850000, 630000], [900000, 610000], [950000, 510000], [1000000, 410000],
      [1050000, 310000], [1100000, 210000], [1150000, 110000], [1200000, 60000], [1230000, 30000],
    ],
    dependentIncomeLimit: 620000,       // 扶養親族・同一生計配偶者の所得要件（改正前58万）
    tokuteiShinzokuIncomeLimit: 1230000,
    withholdingRelativeLimit: 1000000,  // 源泉控除対象親族（特定親族のうち100万円以下）
    withholdingSpouseLimit: 950000,     // 源泉控除対象配偶者
    workingStudentIncomeLimit: 890000,  // 勤労学生（改正前85万）
    widowIncomeLimit: 5000000,          // 寡婦・ひとり親
    deductions: {
      general: 380000, specific: 630000, elderly: 480000, elderlyCohabit: 580000,
      disabled: 270000, specialDisabled: 400000, cohabitSpecialDisabled: 750000,
      widow: 270000, singleParent: 350000, workingStudent: 270000,
    },
    // 所得金額調整控除（子ども・特別障害者等を有する場合）
    adjustment: { threshold: 8500000, cap: 10000000, rate: 0.1, max: 150000 },
    // 年末調整のための算出所得税額の速算表（上限, 税率, 控除額）
    taxRates: [
      [1950000, 0.05, 0], [3300000, 0.10, 97500], [6950000, 0.20, 427500],
      [9000000, 0.23, 636000], [18000000, 0.33, 1536000], [Infinity, 0.40, 2796000],
    ],
    reconstructionRate: 1.021,          // 復興特別所得税を含む年調年税額 = ㉕×102.1%（100円未満切捨て）
    // 生命保険料控除（計算式Ⅰ・Ⅱ・Ⅲ）
    life: {
      formulaI: [[20000, 1, 0], [40000, 0.5, 10000], [80000, 0.25, 20000], [Infinity, 0, 40000]],
      formulaII: [[30000, 1, 0], [60000, 0.5, 15000], [120000, 0.25, 30000], [Infinity, 0, 60000]], // 23歳未満の扶養親族あり・新生命保険料
      formulaIII: [[25000, 1, 0], [50000, 0.5, 12500], [100000, 0.25, 25000], [Infinity, 0, 50000]],
      bothCap: 40000, bothCapUnder23: 60000, totalCap: 120000,
    },
    quake: { cap: 50000, oldLong: [[10000, 1, 0], [20000, 0.5, 5000], [Infinity, 0, 15000]] },
    housingLoanMax: 600000,
    kakutei: { salaryOver: 20000000, otherIncomeOver: 200000 },
  };

  // ------------------------------------------------------------------
  // 2. ユーティリティ
  // ------------------------------------------------------------------
  const num = (v) => {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    const s = String(v).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .replace(/[,，円\s]/g, '').replace(/[−ー－]/g, '-');
    const n = Number(s);
    return isFinite(n) ? n : 0;
  };
  const sum = (arr, f) => arr.reduce((a, x) => a + num(f ? f(x) : x), 0);
  const floorTo = (v, unit) => Math.floor(v / unit) * unit;
  const ceil = (v) => Math.ceil(v - 1e-9);
  const isSet = (v) => v !== null && v !== undefined && v !== '';

  /** 年末（12/31）時点の年齢。1月1日生まれは前日（12/31）に加齢する民法・年齢計算法の扱い。 */
  function ageAtYearEnd(birth, year) {
    if (!birth) return null;
    const m = String(birth).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    return year - y + (mo === 1 && d === 1 ? 1 : 0);
  }

  function bracket(table, x) {
    for (const row of table) if (x <= row[0]) return row;
    return table[table.length - 1];
  }
  function piecewise(table, x) {
    if (x <= 0) return 0;
    const [, rate, add] = bracket(table, x);
    return ceil(rate === 0 ? add : x * rate + add); // 1円未満切上げ
  }

  // ------------------------------------------------------------------
  // 3. 個別計算
  // ------------------------------------------------------------------
  /** ⑨ 給与所得控除後の給与等の金額（計算シート M17 と同じ） */
  function salaryIncomeAfterDeduction(total, T = TABLES) {
    const s = T.salaryIncome;
    if (total > s.maxSalary) return null; // 対象外
    let x = total;
    if (x >= s.roundFrom && x <= s.roundTo) x = x - ((x - s.roundFrom) % s.roundUnit);
    if (x <= s.noIncomeUpTo) return 0;
    if (x <= 2190999) return x - s.minDeduction;
    for (const b of s.fixedBands) if (x <= b.upTo) return b.income;
    if (x <= 3599999) return Math.floor((x * 7) / 10) - 80000;
    if (x <= 6599999) return Math.floor((x * 8) / 10) - 440000;
    if (x <= 8499999) return Math.floor((x * 9) / 10) - 1100000;
    return x - 1950000;
  }

  function incomeAdjustment(total, applicable, T = TABLES) {
    const a = T.adjustment;
    if (!applicable || total <= a.threshold) return 0;
    return Math.min(ceil((Math.min(total, a.cap) - a.threshold) * a.rate), a.max);
  }

  function basicDeduction(totalIncome, T = TABLES) {
    return bracket(T.basic, totalIncome)[1];
  }

  function taxpayerBand(totalIncome, T = TABLES) {
    const b = T.spouseTaxpayerBands;
    if (totalIncome <= b[0]) return 0;
    if (totalIncome <= b[1]) return 1;
    if (totalIncome <= b[2]) return 2;
    return -1;
  }

  function spouseDeduction(taxpayerIncome, spouseIncome, spouseAge, T = TABLES) {
    const band = taxpayerBand(taxpayerIncome, T);
    if (band < 0) return { amount: 0, kind: '', band: '', reason: '本人の合計所得金額が1,000万円超のため適用なし' };
    const bandLabel = 'ABC'[band];
    if (spouseIncome > T.spouse[T.spouse.length - 1][0])
      return { amount: 0, kind: '', band: bandLabel, reason: '配偶者の合計所得金額が133万円超のため適用なし' };
    if (spouseIncome <= T.dependentIncomeLimit) {
      const elderly = spouseAge !== null && spouseAge >= 70;
      return {
        amount: (elderly ? T.spouseElderly : T.spouse[0][1])[band],
        kind: elderly ? '配偶者控除（老人控除対象配偶者）' : '配偶者控除', band: bandLabel,
        class2: elderly ? '①' : '②',
      };
    }
    let idx = 1;
    while (spouseIncome > T.spouse[idx][0]) idx++;
    return { amount: T.spouse[idx][1][band], kind: '配偶者特別控除', band: bandLabel, class2: idx === 1 ? '③' : '④' };
  }

  function tokuteiShinzokuDeduction(income, T = TABLES) {
    if (income <= T.dependentIncomeLimit || income > T.tokuteiShinzokuIncomeLimit) return 0;
    return bracket(T.tokuteiShinzoku, income)[1];
  }

  function incomeTax(taxable, T = TABLES) {
    const [, rate, sub] = bracket(T.taxRates, taxable);
    return Math.max(0, Math.round(taxable * rate - sub));
  }

  /** 生命保険料控除（⑮） */
  function lifeInsuranceDeduction(entries, hasUnder23Dependent, T = TABLES) {
    const L = T.life;
    const s = (kind, era) => sum(entries.filter((e) => e.kind === kind && (era ? e.era === era : true)), (e) => e.amount);
    const newGen = s('general', 'new'), oldGen = s('general', 'old');
    const care = s('care');
    const newPen = s('pension', 'new'), oldPen = s('pension', 'old');
    const g1 = hasUnder23Dependent ? piecewise(L.formulaII, newGen) : piecewise(L.formulaI, newGen);
    const g2 = piecewise(L.formulaIII, oldGen);
    const g3 = newGen > 0 && oldGen > 0 ? Math.min(g1 + g2, hasUnder23Dependent ? L.bothCapUnder23 : L.bothCap) : 0;
    const general = Math.max(g1, g2, g3);
    const p1 = piecewise(L.formulaI, newPen), p2 = piecewise(L.formulaIII, oldPen);
    const p3 = newPen > 0 && oldPen > 0 ? Math.min(p1 + p2, L.bothCap) : 0;
    const pension = Math.max(p1, p2, p3);
    const careDed = piecewise(L.formulaI, care);
    return {
      newGen, oldGen, care, newPen, oldPen,
      general, careDed, pension, g1, g2, g3, p1, p2, p3,
      total: Math.min(general + careDed + pension, L.totalCap),
      under23Rule: hasUnder23Dependent,
    };
  }

  /** 地震保険料控除（⑯） */
  function quakeDeduction(entries, T = TABLES) {
    const quakePaid = sum(entries.filter((e) => e.kind === 'quake'), (e) => e.amount);
    const oldLongPaid = sum(entries.filter((e) => e.kind === 'oldlong'), (e) => e.amount);
    const q = Math.min(quakePaid, T.quake.cap);
    const o = piecewise(T.quake.oldLong, oldLongPaid);
    return { quakePaid, oldLongPaid, quake: q, oldLong: o, total: Math.min(q + o, T.quake.cap) };
  }

  // ------------------------------------------------------------------
  // 4. 扶養控除等申告書の自動区分
  // ------------------------------------------------------------------
  const LINEAL_ASCENDANTS = ['父', '母', '祖父', '祖母', '義父', '義母', '曾祖父', '曾祖母', '養父', '養母'];

  function classifyDependent(d, T = TABLES) {
    const age = ageAtYearEnd(d.birth, T.year);
    const income = num(d.income);
    const out = { age, income, category: '対象外', deduction: 0, tokutei: 0, disability: 0, isFuyo: false, under23: false, notes: [] };
    if (age === null) { out.notes.push('生年月日が未入力です'); return out; }
    const lineal = d.lineal === true || (d.lineal !== false && LINEAL_ASCENDANTS.includes(String(d.relation || '').trim()));
    const nrExcluded = d.nonResident && age >= 30 && age < 70 && !d.nrReason;
    if (income <= T.dependentIncomeLimit) {
      out.isFuyo = true; // 扶養親族（障害者控除・所得金額調整控除・生保特例の判定に使う）
      out.under23 = age < 23;
      if (age < 16) out.category = '年少扶養親族';
      else if (nrExcluded) { out.category = '扶養親族（控除対象外）'; out.notes.push('30歳以上70歳未満の非居住者は留学・障害者・38万円以上の送金のいずれかが必要'); }
      else if (age >= 19 && age <= 22) { out.category = '特定扶養親族'; out.deduction = T.deductions.specific; }
      else if (age >= 70) {
        if (lineal && d.cohabit) { out.category = '同居老親等'; out.deduction = T.deductions.elderlyCohabit; }
        else { out.category = '老人扶養親族'; out.deduction = T.deductions.elderly; }
      } else { out.category = '一般の控除対象扶養親族'; out.deduction = T.deductions.general; }
      const dis = d.disability || 'none';
      if (dis === 'general') out.disability = T.deductions.disabled;
      else if (dis === 'special') out.disability = d.cohabit ? T.deductions.cohabitSpecialDisabled : T.deductions.specialDisabled;
      out.disabilityKind = dis === 'none' ? '' : dis === 'general' ? '一般の障害者' : d.cohabit ? '同居特別障害者' : '特別障害者';
    } else if (age >= 19 && age <= 22 && income <= T.tokuteiShinzokuIncomeLimit) {
      out.category = '特定親族';
      out.tokutei = tokuteiShinzokuDeduction(income, T);
      out.notes.push('特定親族特別控除申告書の提出が必要');
      if (d.disability && d.disability !== 'none') out.notes.push('合計所得62万円超のため障害者控除の対象外');
    } else {
      out.notes.push('所得要件を満たさないため控除対象外');
    }
    out.withholdingTarget = (out.deduction > 0) || (out.category === '特定親族' && income <= T.withholdingRelativeLimit);
    return out;
  }

  // ------------------------------------------------------------------
  // 5. メイン：1人分の年末調整
  // ------------------------------------------------------------------
  const LINE_LABELS = {
    r1: '① 給料・手当等 金額', r3: '③ 給料・手当等 税額', r4: '④ 賞与等 金額', r6: '⑥ 賞与等 税額',
    r7: '⑦ 金額 計', r8: '⑧ 税額 計', r9: '⑨ 給与所得控除後の給与等の金額', r10: '⑩ 所得金額調整控除額',
    r11: '⑪ 給与所得控除後の給与等の金額（調整控除後）', r12: '⑫ 社会保険料等控除額（給与等からの控除分）',
    r13: '⑬ 申告による社会保険料の控除分', r14: '⑭ 申告による小規模企業共済等掛金の控除分',
    r15: '⑮ 生命保険料の控除額', r16: '⑯ 地震保険料の控除額', r17: '⑰ 配偶者（特別）控除額',
    r18: '⑱ 特定親族特別控除額', r19: '⑲ 扶養控除額及び障害者等の控除額の合計額', r20: '⑳ 基礎控除額',
    r21: '㉑ 所得控除額の合計額', r22: '㉒ 差引課税給与所得金額', r23: '㉓ 算出所得税額',
    r24: '㉔ 住宅借入金等特別控除額', r25: '㉕ 年調所得税額', r26: '㉖ 年調年税額（㉕×102.1%）',
    r27: '㉗ 差引超過額又は不足額', r28: '㉘ 本年最後の給与から徴収する税額に充当する金額',
    r29: '㉙ 未払給与に係る未徴収の税額に充当する金額', r30: '㉚ 差引還付する税額',
    r31: '㉛ 本年中に還付する金額', r32: '㉜ 翌年において還付する金額',
    r33: '㉝ 本年最後の給与から徴収する金額', r34: '㉞ 翌年に繰り越して徴収する金額',
  };

  function calculate(emp, T = TABLES) {
    const ov = emp.overrides || {};
    const pick = (key, auto) => (isSet(ov[key]) ? num(ov[key]) : auto);
    const warnings = [];
    const P = emp.payroll || {};
    const salary = (P.salary || []).filter(Boolean);
    const bonus = (P.bonus || []).filter(Boolean);

    // --- 集計シート ---
    const agg = (rows) => ({
      gross: sum(rows, (r) => r.gross), social: sum(rows, (r) => r.social), smallBiz: sum(rows, (r) => r.smallBiz),
      tax: sum(rows, (r) => r.tax), adj: sum(rows, (r) => r.adj),
    });
    const S = agg(salary), B = agg(bonus);

    const L = {};
    L.r1 = pick('r1', S.gross); L.r3 = pick('r3', S.tax);
    L.r4 = pick('r4', B.gross); L.r6 = pick('r6', B.tax);
    L.r7 = L.r1 + L.r4; L.r8 = L.r3 + L.r6;
    const outOfScope = L.r7 > T.salaryIncome.maxSalary;
    if (outOfScope) warnings.push({ level: 'error', msg: '給与等の総額が2,000万円を超えるため年末調整の対象外です（本人が確定申告）。' });

    // --- 扶養控除等申告書 ---
    const F = emp.fuyo || {};
    const self = F.self || {};
    const deps = (F.dependents || []).filter((d) => d && (d.name || d.birth));
    const depResults = deps.map((d) => ({ input: d, ...classifyDependent(d, T) }));
    const hasUnder23Dependent = depResults.some((r) => r.isFuyo && r.under23);

    // --- 配偶者 ---
    const SP = emp.spouse || {};
    const hasSpouse = !!SP.has;
    const spouseIncome = num(SP.income);
    const spouseAge = hasSpouse ? ageAtYearEnd(SP.birth, T.year) : null;
    const sameLivelihoodSpouse = hasSpouse && spouseIncome <= T.dependentIncomeLimit;

    // --- 所得金額調整控除の判定 ---
    const anySpecial = (d) => d === 'special';
    const choseiAuto =
      anySpecial(self.disability) ||
      (sameLivelihoodSpouse && anySpecial(SP.disability)) ||
      depResults.some((r) => r.isFuyo && (anySpecial(r.input.disability) || r.under23));
    const choseiMode = (emp.chosei && emp.chosei.mode) || 'auto';
    const choseiApplicable = choseiMode === 'yes' ? true : choseiMode === 'no' ? false : choseiAuto;

    const r9 = salaryIncomeAfterDeduction(L.r7, T);
    L.r9 = pick('r9', r9 === null ? 0 : r9);
    L.r10 = pick('r10', incomeAdjustment(L.r7, choseiApplicable, T));
    L.r11 = pick('r11', Math.max(0, L.r9 - L.r10));

    // --- 本人の合計所得金額（基礎控除申告書） ---
    const otherIncome = num((emp.kiso || {}).otherIncome);
    const totalIncome = L.r11 + otherIncome;

    // --- 保険料控除申告書 ---
    const H = emp.hoken || {};
    const life = lifeInsuranceDeduction(H.life || [], hasUnder23Dependent, T);
    const quake = quakeDeduction(H.quake || [], T);
    const socialDeclared = sum(H.social || [], (e) => e.amount);
    const nationalPension = sum((H.social || []).filter((e) => e.nationalPension), (e) => e.amount);
    const smallBizDeclared = sum(H.smallBiz || [], (e) => e.amount);

    L.r12 = pick('r12', S.social + B.social);
    L.r13 = pick('r13', socialDeclared);
    L.r14 = pick('r14', smallBizDeclared);
    L.r15 = pick('r15', life.total);
    L.r16 = pick('r16', quake.total);

    const sp = hasSpouse ? spouseDeduction(totalIncome, spouseIncome, spouseAge, T) : { amount: 0, kind: '', band: '' };
    L.r17 = pick('r17', sp.amount);
    L.r18 = pick('r18', sum(depResults, (r) => r.tokutei));

    // --- ⑲ 扶養控除・障害者等（計算シート Ⓐ〜Ⓘ） ---
    const cnt = (cat) => depResults.filter((r) => r.category === cat).length;
    const fuyoBox = { A: cnt('一般の控除対象扶養親族'), B: cnt('特定扶養親族'), C: cnt('同居老親等'), D: cnt('老人扶養親族'), E: 0, F: 0, G: 0, H: '', I: '' };
    const addDis = (kind) => { if (kind === '一般の障害者') fuyoBox.E++; else if (kind === '特別障害者') fuyoBox.F++; else if (kind === '同居特別障害者') fuyoBox.G++; };
    if (self.disability === 'general') fuyoBox.E++;
    if (self.disability === 'special') fuyoBox.F++;
    if (sameLivelihoodSpouse && SP.disability && SP.disability !== 'none')
      addDis(SP.disability === 'general' ? '一般の障害者' : SP.cohabit !== false ? '同居特別障害者' : '特別障害者');
    depResults.forEach((r) => r.isFuyo && r.disabilityKind && addDis(r.disabilityKind));
    if (self.widow === 'widow') fuyoBox.H = '寡婦';
    if (self.widow === 'single_parent') fuyoBox.H = 'ひとり親';
    if (self.student) fuyoBox.I = '該当';
    const D = T.deductions;
    const fuyoAmounts = {
      A: fuyoBox.A * D.general, B: fuyoBox.B * D.specific, C: fuyoBox.C * D.elderlyCohabit, D: fuyoBox.D * D.elderly,
      E: fuyoBox.E * D.disabled, F: fuyoBox.F * D.specialDisabled, G: fuyoBox.G * D.cohabitSpecialDisabled,
      H: fuyoBox.H === '寡婦' ? D.widow : fuyoBox.H === 'ひとり親' ? D.singleParent : 0,
      I: fuyoBox.I ? D.workingStudent : 0,
    };
    L.r19 = pick('r19', Object.values(fuyoAmounts).reduce((a, b) => a + b, 0));
    L.r20 = pick('r20', basicDeduction(totalIncome, T));
    L.r21 = L.r12 + L.r13 + L.r14 + L.r15 + L.r16 + L.r17 + L.r18 + L.r19 + L.r20;
    L.r22 = pick('r22', L.r11 < L.r21 ? 0 : floorTo(L.r11 - L.r21, 1000));
    L.r23 = pick('r23', incomeTax(L.r22, T));

    // --- 住宅借入金等特別控除 ---
    const J = emp.jutaku || {};
    let housing = 0;
    if (isSet(J.direct)) housing = num(J.direct);
    else if (num(J.balance) > 0) housing = Math.min(num(J.balance) * (num(J.rate) || 0.007), num(J.limit) || Infinity);
    housing = Math.min(floorTo(housing, 100), T.housingLoanMax);
    L.r24 = pick('r24', housing);
    L.r25 = pick('r25', Math.max(0, L.r23 - L.r24));
    L.r26 = pick('r26', floorTo(L.r25 * T.reconstructionRate + 1e-9, 100));

    const diff = L.r26 - L.r8;
    const status = diff === 0 ? 'none' : diff < 0 ? 'refund' : 'shortage';
    L.r27 = Math.abs(diff);
    const st = emp.settle || {};
    L.r28 = status === 'refund' ? num(st.r28) : 0;
    L.r29 = status === 'refund' ? num(st.r29) : 0;
    L.r30 = status === 'refund' ? Math.max(0, L.r27 - L.r28 - L.r29) : 0;
    L.r31 = status === 'refund' ? (isSet(st.r31) ? num(st.r31) : L.r30) : 0;
    L.r32 = status === 'refund' ? L.r30 - L.r31 : 0;
    L.r33 = status === 'shortage' ? (isSet(st.r33) ? num(st.r33) : L.r27) : 0;
    L.r34 = status === 'shortage' ? L.r27 - L.r33 : 0;

    // --- チェック（計算シートのエラーメッセージ相当 + 追加） ---
    if (hasSpouse && !isSet(SP.income)) warnings.push({ level: 'error', msg: '「配偶者の合計所得金額」を入力してください。' });
    if (isSet(ov.r17) && hasSpouse && num(ov.r17) !== sp.amount)
      warnings.push({ level: 'error', msg: '「配偶者の合計所得金額」と「配偶者（特別）控除額（⑰欄）」の金額が対応していません。受理した配偶者控除等申告書の内容を確認してください。' });
    if (self.widow && self.widow !== 'none' && totalIncome > T.widowIncomeLimit)
      warnings.push({ level: 'warn', msg: '寡婦・ひとり親は合計所得金額500万円以下が要件です。' });
    if (self.student && totalIncome > T.workingStudentIncomeLimit)
      warnings.push({ level: 'warn', msg: '勤労学生は合計所得金額89万円以下（令和8年分）が要件です。' });
    if (L.r24 > L.r23) warnings.push({ level: 'info', msg: '住宅借入金等特別控除額が算出所得税額を超えています（控除しきれない額は翌年度の住民税で控除される場合があります）。' });
    if (L.r31 > L.r30) warnings.push({ level: 'error', msg: '㉛ 本年中に還付する金額が ㉚ 差引還付する税額を超えています。' });
    if (L.r33 > L.r27 && status === 'shortage') warnings.push({ level: 'error', msg: '㉝ が ㉗ 不足額を超えています。' });
    const months = salary.filter((r) => num(r.gross) > 0).length;
    if (months > 0 && months < 12) warnings.push({ level: 'info', msg: `給与の入力が${months}ヶ月分です。12月分（年末調整を行う月）までの見込額を入力してください。` });
    depResults.forEach((r) => r.notes.forEach((n) => warnings.push({ level: 'info', msg: `${r.input.name || '扶養親族'}：${n}` })));

    // --- 源泉徴収 扶養親族等の数（参考） ---
    let withholdingCount = depResults.filter((r) => r.withholdingTarget).length;
    if (hasSpouse && spouseIncome <= T.withholdingSpouseLimit && totalIncome <= T.spouseTaxpayerBands[0]) withholdingCount++;
    if (self.disability && self.disability !== 'none') withholdingCount++;
    if (self.widow && self.widow !== 'none') withholdingCount++;
    if (self.student) withholdingCount++;
    withholdingCount += fuyoBox.E + fuyoBox.F + fuyoBox.G * 2 - (self.disability && self.disability !== 'none' ? 1 : 0);

    // --- 確定申告の要否 ---
    const K = emp.kakutei || {};
    const kakutei = [];
    if (L.r7 > T.kakutei.salaryOver) kakutei.push({ need: true, msg: '給与の収入金額が2,000万円を超える' });
    if (otherIncome > T.kakutei.otherIncomeOver) kakutei.push({ need: true, msg: '給与所得・退職所得以外の所得が20万円を超える' });
    if (K.multipleEmployers) kakutei.push({ need: true, msg: '2か所以上から給与を受けている（年末調整されなかった給与＋他の所得が20万円超の場合）' });
    if (K.medical) kakutei.push({ need: false, msg: '医療費控除・セルフメディケーション税制は年末調整では控除できない（還付申告）' });
    if (K.donation) kakutei.push({ need: false, msg: '寄附金控除（ワンストップ特例を使わないふるさと納税等）は確定申告で控除' });
    if (K.housingFirstYear) kakutei.push({ need: false, msg: '住宅借入金等特別控除の初年度は確定申告が必要' });
    if (K.casualty) kakutei.push({ need: false, msg: '雑損控除は確定申告で控除' });
    if (outOfScope) kakutei.push({ need: true, msg: '年末調整の対象外' });

    return {
      year: T.year, outOfScope, lines: L, labels: LINE_LABELS, status,
      statusLabel: status === 'refund' ? '差引超過額' : status === 'shortage' ? '差引不足額' : '差引超過額又は不足額',
      aggregate: { salary: S, bonus: B },
      totalIncome, otherIncome, choseiAuto, choseiApplicable,
      fuyo: { box: fuyoBox, amounts: fuyoAmounts, dependents: depResults },
      spouse: { ...sp, age: spouseAge, income: hasSpouse ? spouseIncome : null, sameLivelihood: sameLivelihoodSpouse },
      hasUnder23Dependent, life, quake, socialDeclared, nationalPension, smallBizDeclared,
      smallBizFromPayroll: S.smallBiz + B.smallBiz, housing,
      withholdingCount, kakutei, kakuteiRequired: kakutei.some((k) => k.need), warnings,
      yearEndAdjustment: status === 'refund' ? -L.r27 : L.r27,
    };
  }

  // ------------------------------------------------------------------
  // 6. 新規従業員のひな形
  // ------------------------------------------------------------------
  function blankEmployee(name) {
    return {
      id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      profile: { name: name || '', kana: '', birth: '', address: '', employer: '', employerAddress: '', corpNo: '', note: '' },
      payroll: {
        salary: Array.from({ length: 12 }, (_, i) => ({ month: i + 1, payDate: '', gross: '', social: '', smallBiz: '', depCount: '', tax: '', adj: '' })),
        bonus: Array.from({ length: 4 }, () => ({ payDate: '', gross: '', social: '', smallBiz: '', depCount: '', tax: '', adj: '' })),
      },
      fuyo: { self: { disability: 'none', widow: 'none', student: false }, dependents: [] },
      kiso: { otherIncome: '' },
      spouse: { has: false, name: '', kana: '', birth: '', income: '', nonResident: false, disability: 'none', cohabit: true },
      chosei: { mode: 'auto' },
      hoken: { life: [], quake: [], social: [], smallBiz: [] },
      jutaku: { balance: '', rate: 0.007, limit: '', direct: '' },
      settle: { r28: '', r29: '', r31: '', r33: '' },
      kakutei: { multipleEmployers: false, medical: false, donation: false, housingFirstYear: false, casualty: false },
      overrides: {},
      updatedAt: new Date().toISOString(),
    };
  }

  return {
    TABLES, LINE_LABELS, calculate, blankEmployee, classifyDependent, ageAtYearEnd,
    salaryIncomeAfterDeduction, incomeAdjustment, basicDeduction, spouseDeduction,
    tokuteiShinzokuDeduction, incomeTax, lifeInsuranceDeduction, quakeDeduction, num,
  };
});
</script>
<script>
/*
 * 給与明細PDF 読取りパーサー
 *
 * PDF.js で取り出したテキスト片（座標付き）または平文テキストから、
 * 集計シートに必要な項目（支給日・総支給金額・社会保険料等・所得税・扶養人数）を抽出する。
 * 給与ソフトごとに表記が違うため、ラベル辞書 LABELS を拡張して対応する。
 * スキャン画像のPDF（文字情報なし）は読めないため、OCRするか手入力する。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Payslip = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // 先に書いたものほど優先。完全一致 > 前方一致 > 部分一致 の順に評価する。
  const LABELS = {
    gross: ['総支給額', '総支給金額', '支給合計', '支給額合計', '支給合計額', '総支給', '支給総額', '賞与支給額', '支給額計'],
    socialTotal: ['社会保険料合計', '社会保険料計', '社会保険計', '社保合計', '社会保険料等合計', '社会保険料'],
    health: ['健康保険料', '健康保険', '健保'],
    care: ['介護保険料', '介護保険'],
    pension: ['厚生年金保険料', '厚生年金保険', '厚生年金', '厚年'],
    employment: ['雇用保険料', '雇用保険'],
    childSupport: ['子ども・子育て支援金', '子ども子育て支援金', '子育て支援金', '支援金'],
    fund: ['厚生年金基金', '健保組合', '企業年金'],
    smallBiz: ['確定拠出年金', 'マッチング拠出', 'iDeCo', 'イデコ', '小規模企業共済'],
    tax: ['源泉所得税', '所得税'],
    residentTax: ['住民税', '市町村民税', '市県民税'],
    deductionTotal: ['控除合計', '控除額合計', '控除計'],
    net: ['差引支給額', '差引支給', '手取額', '振込支給額', '振込額'],
    depCount: ['扶養人数', '扶養親族等の数', '扶養親族数', '税扶養'],
  };
  const EXCLUDE = {
    tax: ['住民税', '課税', '非課税', '所得税調整'],
    gross: ['課税'],
    socialTotal: [],
    health: ['介護'],
  };

  const z2h = (s) => String(s || '')
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/[，]/g, ',').replace(/[．]/g, '.').replace(/[　]/g, ' ').replace(/[−ー－‐]/g, '-')
    .replace(/￥|¥/g, '');
  const norm = (s) => z2h(s).replace(/\s+/g, '');

  const NUM_RE = /^-?\(?-?\d{1,3}(,\d{3})+\)?(円)?$|^-?\d+(円)?$/;
  function parseNum(s) {
    const t = z2h(s).replace(/\s/g, '');
    if (!NUM_RE.test(t)) return null;
    const neg = t.startsWith('-') || t.startsWith('(');
    const n = Number(t.replace(/[^0-9]/g, ''));
    return neg ? -n : n;
  }

  /** 和暦・西暦の日付を ISO 形式に */
  function parseDate(text) {
    const t = z2h(text);
    let m = t.match(/(令和|R)\s*(\d{1,2}|元)\s*[年.\/-]\s*(\d{1,2})\s*[月.\/-]\s*(\d{1,2})\s*日?/);
    if (m) return iso(2018 + (m[2] === '元' ? 1 : +m[2]), +m[3], +m[4]);
    m = t.match(/(20\d{2})\s*[年.\/-]\s*(\d{1,2})\s*[月.\/-]\s*(\d{1,2})/);
    if (m) return iso(+m[1], +m[2], +m[3]);
    return null;
  }
  function parsePeriod(text) {
    const t = z2h(text);
    let m = t.match(/(令和|R)\s*(\d{1,2}|元)\s*年\s*(\d{1,2})\s*月\s*分/);
    if (m) return { year: 2018 + (m[2] === '元' ? 1 : +m[2]), month: +m[3] };
    m = t.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月\s*分/);
    if (m) return { year: +m[1], month: +m[2] };
    m = t.match(/(\d{1,2})\s*月\s*分/);
    if (m) return { year: null, month: +m[1] };
    return null;
  }
  const iso = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  function labelScore(text, key) {
    const t = norm(text);
    if (!t || (EXCLUDE[key] || []).some((x) => t.includes(x))) return 0;
    let best = 0;
    LABELS[key].forEach((lab, i) => {
      const w = LABELS[key].length - i; // 辞書の前方ほど高い
      if (t === lab) best = Math.max(best, 300 + w);
      else if (t.startsWith(lab) && t.length <= lab.length + 3) best = Math.max(best, 200 + w);
      else if (t.includes(lab) && t.length <= lab.length + 6) best = Math.max(best, 100 + w);
    });
    return best;
  }

  /**
   * 座標付きテキスト片から抽出する。
   * @param {Array<{str:string,x:number,y:number,w:number,h:number,page?:number}>} items  y は上から下へ増える座標
   */
  function parseItems(items) {
    const cells = items.map((it) => ({ ...it, str: String(it.str || '').trim() })).filter((it) => it.str);
    const nums = cells.map((c) => ({ c, v: parseNum(c.str) })).filter((n) => n.v !== null);
    const fullText = linesFromItems(cells).join('\n');
    const result = { fields: {}, sources: {} };

    Object.keys(LABELS).forEach((key) => {
      let best = null;
      cells.forEach((c) => {
        const s = labelScore(c.str, key);
        if (!s) return;
        // ラベル片の中に数値が含まれる場合（例「所得税 12,345」）
        const inline = z2h(c.str).match(/(-?\d{1,3}(?:,\d{3})+|-?\d+)\s*円?\s*$/);
        const v = inline && norm(c.str).replace(inline[0].replace(/\s/g, ''), '') ? parseNum(inline[1]) : null;
        let cand = v !== null ? { v, dist: 0 } : findValue(c, nums);
        if (cand && (!best || s > best.s || (s === best.s && cand.dist < best.dist))) best = { s, v: cand.v, dist: cand.dist, label: c.str };
      });
      if (best) { result.fields[key] = best.v; result.sources[key] = best.label; }
    });
    return finalize(result, fullText);
  }

  function findValue(label, nums) {
    const lh = label.h || 10;
    let best = null;
    nums.forEach(({ c, v }) => {
      if (c === label || (c.page || 0) !== (label.page || 0)) return;
      const dy = c.y - label.y;
      const dxRight = c.x - (label.x + (label.w || 0));
      const sameLine = Math.abs(dy) <= lh * 0.6;
      const lcx = label.x + (label.w || 0) / 2, ccx = c.x + (c.w || 0) / 2;
      const colOverlap = Math.abs(lcx - ccx) <= Math.max(label.w || 0, c.w || 0, 30) * 0.75;
      let dist = null;
      if (sameLine && dxRight >= -2 && dxRight < 260) dist = dxRight;               // 同じ行の右側
      else if (dy > lh * 0.4 && dy < lh * 4 && colOverlap) dist = 1000 + dy;         // 直下（表形式）
      if (dist !== null && (!best || dist < best.dist)) best = { v, dist };

    return best;
  }

  function linesFromItems(cells) {
    const sorted = [...cells].sort((a, b) => (a.page || 0) - (b.page || 0) || a.y - b.y || a.x - b.x);
    const lines = [];
    let cur = [], lastY = null, lastP = null;
    sorted.forEach((c) => {
      if (lastY !== null && (Math.abs(c.y - lastY) > (c.h || 10) * 0.5 || c.page !== lastP)) { lines.push(cur); cur = []; }
      cur.push(c); lastY = c.y; lastP = c.page;
    });
    if (cur.length) lines.push(cur);
    return lines.map((l) => l.sort((a, b) => a.x - b.x).map((c) => c.str).join('  '));
  }

  /** 平文テキスト（pdftotext -layout 等）から抽出する */
  function parseText(text) {
    // 空行を除き、空白・タブ・縦線で区切ったトークン列にする（pdftotext -layout の出力にも対応）
    const lines = String(text).split(/\r?\n/)
      .map((l) => z2h(l).split(/[\s|]+/).map((s) => s.trim()).filter(Boolean))
      .filter((toks) => toks.length);
    const isNum = (t) => parseNum(t) !== null;
    const result = { fields: {}, sources: {} };
    Object.keys(LABELS).forEach((key) => {
      let best = null;
      lines.forEach((tokens, li) => {
        tokens.forEach((tok, ti) => {
          const s = labelScore(tok, key);
          if (!s) return;
          let v = null;
          // ① 同じ行でラベルの直後が数値（例「所得税 5,620」）
          if (tokens[ti + 1] !== undefined && isNum(tokens[ti + 1])) v = parseNum(tokens[ti + 1]);
          // ② 表形式：ラベル行のラベル数と次の行の数値数が同じなら、同じ順番の数値
          if (v === null) {
            const labelsInRow = tokens.filter((t) => !isNum(t));
            const below = lines[li + 1] || [];
            const nums = below.filter(isNum);
            const pos = labelsInRow.indexOf(tok);
            if (labelsInRow.length === tokens.length && nums.length === labelsInRow.length && pos >= 0) v = parseNum(nums[pos]);
          }
          if (v !== null && (!best || s > best.s)) best = { s, v, label: tok };
        });
      });
      if (best) { result.fields[key] = best.v; result.sources[key] = best.label; }
    });
    return finalize(result, text);
  }

  function finalize(result, fullText) {
    const f = result.fields;
    const parts = ['health', 'care', 'pension', 'employment', 'childSupport', 'fund'];
    const partsSum = parts.reduce((a, k) => a + (f[k] || 0), 0);
    const social = f.socialTotal !== undefined ? f.socialTotal : partsSum || undefined;
    const t = z2h(fullText);
    const isBonus = /賞与|ボーナス|期末手当|勤勉手当/.test(t);
    let payDate = null;
    const dm = t.match(/(支給日|支払日|支給年月日|振込日)[^\d令R]{0,6}((令和|R)?\s*[\d元]{1,4}\s*[年.\/-]\s*\d{1,2}\s*[月.\/-]\s*\d{1,2}\s*日?)/);
    if (dm) payDate = parseDate(dm[2]);
    if (!payDate) payDate = parseDate(t);
    const period = parsePeriod(t);
    const warnings = [];
    if (f.gross === undefined) warnings.push('総支給金額が見つかりません');
    if (social === undefined) warnings.push('社会保険料が見つかりません');
    if (f.tax === undefined) warnings.push('所得税が見つかりません');
    if (f.socialTotal !== undefined && partsSum && Math.abs(partsSum - f.socialTotal) > 1)
      warnings.push(`社会保険料の内訳合計(${partsSum.toLocaleString()})と合計欄(${f.socialTotal.toLocaleString()})が一致しません`);
    if (f.net !== undefined && f.gross !== undefined && f.deductionTotal !== undefined && f.gross - f.deductionTotal !== f.net)
      warnings.push('総支給額 − 控除合計 が差引支給額と一致しません（読取り位置を確認してください）');
    const month = period ? period.month : payDate ? +payDate.slice(5, 7) : null;
    return {
      kind: isBonus ? 'bonus' : 'salary', payDate, period, month,
      gross: f.gross ?? null, social: social ?? null, smallBiz: f.smallBiz ?? null,
      tax: f.tax ?? null, depCount: f.depCount ?? null, residentTax: f.residentTax ?? null, net: f.net ?? null,
      socialParts: Object.fromEntries(parts.filter((k) => f[k] !== undefined).map((k) => [k, f[k]])),
      sources: result.sources, warnings,
    };
  }

  return { LABELS, parseItems, parseText, parseDate, parsePeriod, parseNum };
});

    put(q, 'B4', '給与所得・退職所得以外の所得の合計額が20万円を超える'); put(q, 'C4', `=IF(${R(SH.kiso, 'C4')}>200000,"要","")`);
    const yn = (v) => (v ? 'はい' : 'いいえ');
    [['2か所以上から給与を受けている（年末調整されない給与＋他の所得が20万円超）', Kk.multipleEmployers],
      ['医療費控除・セルフメディケーション税制を受ける', Kk.medical],
      ['寄附金控除を受ける（ふるさと納税でワンストップ特例を使わない等）', Kk.donation],
      ['住宅借入金等特別控除の初年度', Kk.housingFirstYear],
      ['雑損控除を受ける', Kk.casualty]]
      .forEach(([x, v], i) => { put(q, 'B' + (5 + i), x); put(q, 'C' + (5 + i), yn(v), { input: true, list: ['はい', 'いいえ'] }); });
    put(q, 'B11', '判定', { head: true });
    put(q, 'C11', '=IF(COUNTIF(C3:C4,"要")+COUNTIF(C5,"はい")>0,"確定申告が必要な可能性があります",IF(COUNTIF(C6:C9,"はい")>0,"確定申告（還付申告）で控除を受けられます","年末調整で完了"))', { total: true });
    put(q, 'B13', '出典：国税庁 タックスアンサーNo.1900「給与所得者で確定申告が必要な人」、所得税の確定申告', { border: false });

    // =====================================================================
    // 各種申告書・参考情報
    // =====================================================================
    const rf = SH.ref;
    widths(rf, [4, 90]);
    put(rf, 'A2', '※ 国税庁ホームページに掲載している各種申告書や参考となる情報の一覧です。', { border: false });
    [['令和8年分 年末調整のしかた', 'https://www.nta.go.jp/publication/pamph/gensen/nencho2026/01.htm'],
      ['各種申告書（扶養控除等・基礎/配偶者/特定親族/所得金額調整・保険料控除）', 'https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/gensen/annai/1648_01.htm'],
      ['令和8年分 年末調整チェック表', 'https://www.nta.go.jp/publication/pamph/gensen/nencho2026/pdf/206.pdf'],
      ['令和8年分 年末調整Q&A', 'https://www.nta.go.jp/publication/pamph/gensen/nencho2026/pdf/207.pdf'],
      ['所得税徴収高計算書（納付書）の記載方法', 'https://www.nta.go.jp/publication/pamph/gensen/nencho2026/pdf/111.pdf'],
      ['令和8年分 給与所得の源泉徴収票等の法定調書の作成と提出の手引', 'https://www.nta.go.jp/publication/pamph/hotei/tebiki2026/index.htm'],
      ['No.1410 給与所得控除', 'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm'],
      ['No.1900 給与所得者で確定申告が必要な人', 'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1900.htm'],
      ['所得税の確定申告', 'https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei.htm']]
      .forEach(([x, url], i) => {
        put(rf, 'A' + (4 + i), i + 1);
        const cell = put(rf, 'B' + (4 + i), { text: x, hyperlink: url });
        cell.font = { color: { argb: 'FF0563C1' }, underline: true };
      });

    return wb;
  }

  return { build, SHEETS: SH };
});
</script>
<script>
/* 年末調整 一元管理 WEBアプリ（UI）
 * データの流れ：給与明細PDF → 集計シート → 各申告書 → 計算シート（自動）→ 源泉徴収簿・Excel出力
 * 依存：engine.js（Nencho）, payslip.js（Payslip）, workbook.js（NenchoWorkbook）, pdf.js, ExcelJS
 */
(function () {
  'use strict';
  const N = window.Nencho, P = window.Payslip, W = window.NenchoWorkbook;
  const STORE_KEY = 'nencho-r8-v1';
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const yen = (v) => (v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('ja-JP'));
  const fmtIn = (v) => (v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('ja-JP'));
  const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const setPath = (o, p, v) => {
    const ks = p.split('.'); let a = o;
    for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[ks[i]]; }
    a[ks[ks.length - 1]] = v;
  };

  // ------------------------------------------------------------------ 状態
  let state = load();
  let tab = 'dashboard';
  let parsed = []; // 給与明細の読取り結果（反映前）
  let result = null;

  function load() {
    try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.employees)) return s; } catch (e) { /* 初回・閲覧制限 */ }
    return { employees: [], currentId: null };
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 保存不可環境 */ }
    }, 250);
  }
  const emp = () => state.employees.find((e) => e.id === state.currentId) || null;

  // ------------------------------------------------------------------ 入力部品
  const numIn = (path, extra = '') => `<input class="num" data-bind="${path}" data-type="num" inputmode="numeric" value="${esc(fmtIn(getPath(emp(), path)))}" ${extra}>`;
  const txtIn = (path, extra = '') => `<input data-bind="${path}" data-type="text" value="${esc(getPath(emp(), path))}" ${extra}>`;
  const dateIn = (path) => `<input type="date" data-bind="${path}" data-type="text" value="${esc(getPath(emp(), path))}">`;
  const sel = (path, options) => {
    const v = getPath(emp(), path);
    return `<select data-bind="${path}" data-type="select">${options.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  };
  const chk = (path, label) => `<label class="check"><input type="checkbox" data-bind="${path}" data-type="bool" ${getPath(emp(), path) ? 'checked' : ''}> ${esc(label)}</label>`;
  const field = (label, input) => `<label class="field"><span>${esc(label)}</span>${input}</label>`;
  const out = (path, cls = 'n') => `<span class="${cls}" data-out="${path}"></span>`;

  // ------------------------------------------------------------------ タブ
  const TABS = [
    ['dashboard', '従業員一覧'], ['profile', '基本情報'], ['import', '給与明細取込'], ['agg', '集計シート'],
    ['fuyo', '扶養控除等申告書'], ['kiso', '基礎・配偶者・特定親族・所得金額調整'], ['hoken', '保険料控除申告書'],
    ['jutaku', '住宅借入金等特別控除'], ['calc', '計算シート'], ['boki', '源泉徴収簿'], ['kakutei', '確定申告チェック'], ['data', 'Excel出力・データ管理'],
  ];
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('');
    const s = $('#empSelect');
    s.innerHTML = state.employees.length
      ? state.employees.map((e) => `<option value="${e.id}" ${e.id === state.currentId ? 'selected' : ''}>${esc(e.profile.name || '（氏名未入力）')}</option>`).join('')
      : '<option value="">従業員が未登録です</option>';
  }

  function render() {
    renderTabs();
    const e = emp();
    const main = $('#main');
    if (!e && tab !== 'dashboard' && tab !== 'data') tab = 'dashboard';
    const views = { dashboard, profile, import: importView, agg, fuyo, kiso, hoken, jutaku, calc, boki, kakutei, data };
    main.innerHTML = views[tab]();
    if (tab === 'import') bindDrop();
    recompute();
  }

  // ------------------------------------------------------------------ 再計算と出力欄の更新
  function recompute() {
    const e = emp();
    result = e ? N.calculate(e) : null;
    if (result) extraOutputs();
    $$('[data-out]').forEach((el) => {
      const v = result ? getPath(result, el.dataset.out) : '';
      el.textContent = typeof v === 'number' ? yen(v) : v ?? '';
    });
    $$('[data-depcls]').forEach((el) => {
      const d = e.fuyo.dependents[+el.dataset.depcls];
      const c = d && (d.name || d.birth) ? N.classifyDependent(d) : null;
      const k = el.dataset.k;
      el.textContent = !c ? '' : k === 'age' ? (c.age ?? '') : k === 'cat' ? c.category : yen(c[k] || 0);
    });
    $$('[data-calc-auto]').forEach((el) => {
      const key = el.dataset.calcAuto;
      const ov = { ...(e.overrides || {}) }; delete ov[key];
      el.textContent = yen(N.calculate({ ...e, overrides: ov }).lines[key]);
    });
    $$('input[data-bind^="overrides."]').forEach((el) => el.classList.toggle('override', el.value !== ''));
    renderSummary();
    if (result) updateAggRows();
    if (tab === 'dashboard') $$('[data-emp-row]').forEach(updateDashRow);
  }

  function renderSummary() {
    const box = $('#summary');
    const e = emp();
    if (!e || !result) { box.innerHTML = '<div class="card"><p class="note">従業員を追加すると、ここに年末調整の結果が表示されます。</p></div>'; return; }
    const L = result.lines;
    const cls = result.status === 'refund' ? 'result-refund' : result.status === 'shortage' ? 'result-shortage' : '';
    const msgs = result.warnings.map((w) => `<li class="${w.level}">${esc(w.msg)}</li>`).join('');
    box.innerHTML = `<div class="card">
      <div class="note">${esc(e.profile.name || '（氏名未入力）')} ／ 令和8年分</div>
      ${result.outOfScope ? '<p class="pill err">年末調整の対象外（2,000万円超）</p>' : ''}
      <div class="kv"><span>⑦ 給与等の金額</span><span>${yen(L.r7)}</span></div>
      <div class="kv"><span>⑪ 給与所得</span><span>${yen(L.r11)}</span></div>
      <div class="kv"><span>㉑ 所得控除合計</span><span>${yen(L.r21)}</span></div>
      <div class="kv"><span>㉒ 課税給与所得</span><span>${yen(L.r22)}</span></div>
      <div class="kv"><span>㉖ 年調年税額</span><span>${yen(L.r26)}</span></div>
      <div class="kv"><span>⑧ 源泉徴収済み税額</span><span>${yen(L.r8)}</span></div>
      <p style="margin:10px 0 0">${esc(result.statusLabel)}</p>
      <div class="big ${cls}">${yen(L.r27)} 円</div>
      <p class="note">${result.status === 'refund' ? '本人へ還付' : result.status === 'shortage' ? '本人から追加徴収' : ''}
      ${result.kakuteiRequired ? '<br><span class="pill warn">確定申告が必要な可能性</span>' : ''}</p>
      <h3>チェック（${result.warnings.length}件）</h3>
      <ul class="msgs">${msgs || '<li class="info">指摘事項はありません</li>'}</ul>
    </div>`;
  }

  // ------------------------------------------------------------------ 各画面
  function dashboard() {
    const rows = state.employees.map((e) => `<tr data-emp-row="${e.id}">
      <td>${esc(e.profile.name || '（氏名未入力）')}</td><td class="n" data-c="r7"></td><td class="n" data-c="r21"></td>
      <td class="n" data-c="r26"></td><td class="n" data-c="r8"></td><td data-c="status"></td><td class="n" data-c="r27"></td>
      <td data-c="kakutei"></td><td data-c="warn"></td>
      <td><button class="btn small" data-action="open" data-id="${e.id}">開く</button>
          <button class="btn small" data-action="dup" data-id="${e.id}">複製</button>
          <button class="btn small danger" data-action="del" data-id="${e.id}">削除</button></td></tr>`).join('');
    return `<section>
      <h2>従業員一覧（令和8年分）</h2>
      <p class="lead">従業員ごとに 給与明細 → 集計シート → 各申告書 → 計算シート を自動連携します。行の「開く」で各画面へ。</p>
      <div class="toolbar"><button class="btn primary" data-action="new-employee">＋ 従業員を追加</button>
      <button class="btn" data-action="sample">サンプルデータを追加</button>
      <button class="btn" data-action="export-list">一覧をCSVで出力</button></div>
      <div class="table-wrap"><table><thead><tr><th>氏名</th><th class="n">⑦給与等</th><th class="n">㉑所得控除</th><th class="n">㉖年調年税額</th>
      <th class="n">⑧徴収済</th><th>区分</th><th class="n">㉗過不足額</th><th>確定申告</th><th>チェック</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="10">従業員が未登録です。「従業員を追加」から始めてください。</td></tr>'}</tbody></table></div>
      <div class="flex" style="margin-top:12px">
        <div class="card"><h3>年末調整の手順（このアプリでの操作）</h3><ol class="note">
          <li>基本情報を入力し、給与明細PDF（12ヶ月分・賞与）を取り込む → 集計シートに反映</li>
          <li>扶養控除等申告書：扶養親族の生年月日・所得・同居を入力（区分は自動判定）</li>
          <li>基礎・配偶者・特定親族・所得金額調整：その他の所得・配偶者情報を入力（控除額は自動計算）</li>
          <li>保険料控除・住宅借入金等特別控除を入力</li>
          <li>計算シートで①〜㉞を確認（必要なら手入力で上書き）→ 超過・不足額を精算</li>
          <li>Excel出力（関数付き・全シート編集可）／源泉徴収簿を印刷</li></ol></div>
        <div class="card"><h3>集計</h3><div id="dashTotals" class="note"></div></div>
      </div></section>`;
  }
  function updateDashRow(tr) {
    const e = state.employees.find((x) => x.id === tr.dataset.empRow);
    if (!e) return;
    const r = N.calculate(e), L = r.lines;
    const set = (k, v) => { const td = $(`[data-c="${k}"]`, tr); if (td) td.innerHTML = v; };
    ['r7', 'r21', 'r26', 'r8', 'r27'].forEach((k) => set(k, yen(L[k])));
    set('status', `<span class="pill ${r.status === 'refund' ? 'ok' : r.status === 'shortage' ? 'err' : ''}">${esc(r.statusLabel)}</span>`);
    set('kakutei', r.kakuteiRequired ? '<span class="pill warn">要確認</span>' : '');
    const errs = r.warnings.filter((w) => w.level !== 'info').length;
    set('warn', errs ? `<span class="pill warn">${errs}件</span>` : '<span class="pill ok">OK</span>');
    const tot = $('#dashTotals');
    if (tot) {
      const all = state.employees.map((x) => N.calculate(x));
      const refund = all.filter((x) => x.status === 'refund').reduce((a, x) => a + x.lines.r27, 0);
      const short = all.filter((x) => x.status === 'shortage').reduce((a, x) => a + x.lines.r27, 0);
      tot.innerHTML = `対象 ${all.length} 名 ／ 還付合計 <b>${yen(refund)}</b> 円 ／ 追加徴収合計 <b>${yen(short)}</b> 円 ／ 確定申告要確認 ${all.filter((x) => x.kakuteiRequired).length} 名`;
    }
  }

  function profile() {
    return `<section><h2>基本情報</h2><p class="lead">計算シート上部（氏名）と各申告書の共通項目です。</p>
      <div class="grid">
        ${field('氏名', txtIn('profile.name'))}${field('フリガナ', txtIn('profile.kana'))}${field('生年月日', dateIn('profile.birth'))}
        ${field('住所又は居所', txtIn('profile.address'))}${field('給与の支払者の名称', txtIn('profile.employer'))}
        ${field('給与の支払者の所在地', txtIn('profile.employerAddress'))}${field('給与の支払者の法人番号', txtIn('profile.corpNo'))}
        ${field('備考', txtIn('profile.note'))}
      </div></section>`;
  }

  // ---- 給与明細取込 ----
  function importView() {
    const rows = parsed.map((p, i) => `<tr>
      <td>${esc(p.file)}</td>
      <td><select data-parsed="${i}" data-k="kind"><option value="salary" ${p.kind === 'salary' ? 'selected' : ''}>給料・手当等</option><option value="bonus" ${p.kind === 'bonus' ? 'selected' : ''}>賞与等</option></select></td>
      <td><input class="num" style="min-width:48px" data-parsed="${i}" data-k="month" value="${esc(p.month ?? '')}"></td>
      <td><input type="date" data-parsed="${i}" data-k="payDate" value="${esc(p.payDate ?? '')}"></td>
      ${['gross', 'socialTotal', 'smallBiz', 'tax', 'depCount'].map((k) => `<td><input class="num" data-parsed="${i}" data-k="${k}" value="${esc(fmtIn(p[k]))}"></td>`).join('')}
      <td>${p.warnings.map((w) => `<div class="pill warn">${esc(w)}</div>`).join('') || '<span class="pill ok">OK</span>'}</td>
      <td><button class="btn small primary" data-action="apply-parsed" data-i="${i}">反映</button></td></tr>`).join('');
    return `<section><h2>給与明細取込（PDF）</h2>
      <p class="lead">給与明細・賞与明細のPDFをまとめてドロップすると、支給日・総支給金額・社会保険料等・所得税を読み取り、確認後に集計シートへ反映します。
      文字情報のないスキャンPDFは読み取れません（下の「テキスト貼り付け」か手入力を使用）。</p>
      <div class="drop no-print" id="drop" tabindex="0">ここにPDFをドロップ、またはクリックして選択（複数可）
        <input type="file" id="pdfFile" accept="application/pdf" multiple hidden></div>
      <details style="margin-top:12px"><summary>テキスト貼り付けで読み取る</summary>
        <textarea id="pasteText" placeholder="給与明細のテキストを貼り付け"></textarea>
        <button class="btn" data-action="parse-text">読み取る</button></details>
      <h3>読取り結果（反映前に確認・修正できます）</h3>
      <p class="note">「社会保険料等」は健康保険・介護保険・厚生年金・雇用保険・子ども・子育て支援金の合計です。
      反映時は「社会保険料等＋小規模共済等掛金」を集計シートの「社会保険料等の控除額」に、掛金を「うち小規模企業共済等掛金」に入れます。</p>
      <div class="table-wrap"><table><thead><tr><th>ファイル</th><th>区分</th><th>月</th><th>支給月日</th><th class="n">総支給金額</th>
        <th class="n">社会保険料等</th><th class="n">小規模共済等掛金</th><th class="n">所得税</th><th class="n">扶養人数</th><th>確認事項</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="11">まだ読み取ったPDFはありません。</td></tr>'}</tbody></table></div>
      <div class="toolbar">${parsed.length ? '<button class="btn primary" data-action="apply-all">すべて集計シートへ反映</button><button class="btn" data-action="clear-parsed">読取り結果をクリア</button>' : ''}</div>
      </section>`;
  }
  function bindDrop() {
    const drop = $('#drop'), file = $('#pdfFile');
    if (!drop) return;
    drop.addEventListener('click', () => file.click());
    drop.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') file.click(); });
    drop.addEventListener('dragover', (ev) => { ev.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (ev) => { ev.preventDefault(); drop.classList.remove('over'); readPdfs(ev.dataTransfer.files); });
    file.addEventListener('change', () => readPdfs(file.files));
  }
  async function readPdfs(files) {
    if (!window.pdfjsLib) { alert('PDF読取りライブラリ（pdf.js）を読み込めませんでした。ネットワーク接続を確認してください。'); return; }
    if (!pdfjsLib.GlobalWorkerOptions.workerSrc)
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    for (const f of Array.from(files)) {
      try {
        const items = await pdfItems(await f.arrayBuffer());
        if (!items.length) { parsed.push(emptyParsed(f.name, '文字情報がありません（スキャン画像の可能性）。手入力してください')); continue; }
        parsed.push(toParsed(f.name, P.parseItems(items)));
      } catch (err) { parsed.push(emptyParsed(f.name, 'PDFを読み取れませんでした：' + err.message)); }
    }
    parsed.sort((a, b) => (a.kind === b.kind ? (a.month || 0) - (b.month || 0) : a.kind === 'salary' ? -1 : 1));
    render();
  }
  async function pdfItems(buf) {
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    const items = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      tc.items.forEach((it) => {
        if (!it.str || !it.str.trim()) return;
        const [, , , d, x, y] = it.transform;
        const h = Math.abs(d) || it.height || 10;
        items.push({ str: it.str, x, y: vp.height - y - h, w: it.width, h, page: p });
      });
    }
    return items;
  }
  const toParsed = (file, r) => ({
    file, kind: r.kind, month: r.month, payDate: r.payDate, gross: r.gross, socialTotal: r.social, smallBiz: r.smallBiz,
    tax: r.tax, depCount: r.depCount, warnings: r.warnings,
  });
  const emptyParsed = (file, msg) => ({ file, kind: 'salary', month: null, payDate: '', gross: null, socialTotal: null, smallBiz: null, tax: null, depCount: null, warnings: [msg] });

  function applyParsed(i) {
    const p = parsed[i], e = emp();
    if (!p) return false;
    const n = (v) => (v === null || v === undefined || v === '' ? '' : N.num(v));
    const row = { payDate: p.payDate || '', gross: n(p.gross), social: n(p.socialTotal) === '' && n(p.smallBiz) === '' ? '' : (n(p.socialTotal) || 0) + (n(p.smallBiz) || 0),
      smallBiz: n(p.smallBiz), tax: n(p.tax), depCount: n(p.depCount) };
    if (p.kind === 'salary') {
      const m = N.num(p.month);
      if (!(m >= 1 && m <= 12)) { alert(`${p.file}：月（1〜12）を入力してください`); return false; }
      Object.assign(e.payroll.salary[m - 1], row);
    } else {
      let idx = e.payroll.bonus.findIndex((b) => b.payDate && b.payDate === row.payDate);
      if (idx < 0) idx = e.payroll.bonus.findIndex((b) => !N.num(b.gross));
      if (idx < 0) { alert('賞与等の行（4行）が埋まっています'); return false; }
      Object.assign(e.payroll.bonus[idx], row);
    }
    p.applied = true;
    return true;
  }

  // ------------------------------------------------------------------ 追加の出力欄
  function extraOutputs() {

  // ------------------------------------------------------------------ 操作
  function addEmployee(e) {
    state.employees.push(e); state.currentId = e.id; save();

  async function exportExcel(e) {
    if (!window.ExcelJS) { alert('Excel出力ライブラリ（ExcelJS）を読み込めませんでした。ネットワーク接続を確認してください。'); return; }
    const r = N.calculate(e);
    const wb = W.build(window.ExcelJS, e, r);
    const buf = await wb.xlsx.writeBuffer();
    download(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `年末調整計算シート_令和8年分_${e.profile.name || e.id}.xlsx`);
  }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function sampleEmployee() {

  document.addEventListener('click', async (ev) => {
    const tabBtn = ev.target.closest('[data-tab]');
    if (tabBtn) { tab = tabBtn.dataset.tab; render(); $('#main').focus(); return; }
    const b = ev.target.closest('[data-action]');
    if (!b) return;
    const e = emp();
    const act = b.dataset.action;
    if (act === 'new-employee') { addEmployee(N.blankEmployee('')); tab = 'profile'; render(); }
    else if (act === 'sample') { addEmployee(sampleEmployee()); render(); }
    else if (act === 'open') { state.currentId = b.dataset.id; tab = 'agg'; save(); render(); }
    else if (act === 'dup') {
      const src = state.employees.find((x) => x.id === b.dataset.id);
      const c = JSON.parse(JSON.stringify(src)); c.id = N.blankEmployee().id; c.profile.name += '（コピー）'; addEmployee(c); render();
    } else if (act === 'del') {
      const src = state.employees.find((x) => x.id === b.dataset.id);
      if (confirm(`${src.profile.name || 'この従業員'} を削除しますか？（元に戻せません）`)) {
        state.employees = state.employees.filter((x) => x.id !== b.dataset.id);
        state.currentId = state.employees[0] ? state.employees[0].id : null; save(); render();
      }
    } else if (act === 'add-dep') { e.fuyo.dependents.push({ name: '', relation: '子', birth: '', income: '', cohabit: true, disability: 'none', nonResident: false, nrReason: '' }); save(); render(); }
    else if (act === 'add-row') {
      const blank = { 'hoken.life': { company: '', kind: 'general', era: 'new', amount: '' }, 'hoken.quake': { company: '', kind: 'quake', amount: '' },
        'hoken.social': { kind: '', payer: '', person: '', amount: '', nationalPension: false }, 'hoken.smallBiz': { kind: '個人型確定拠出年金', amount: '' } }[b.dataset.list];
      getPath(e, b.dataset.list).push(blank); save(); render();
    } else if (act === 'del-row') { getPath(e, b.dataset.list).splice(+b.dataset.i, 1); save(); render(); }
    else if (act === 'apply-parsed') { if (applyParsed(+b.dataset.i)) { parsed.splice(+b.dataset.i, 1); save(); render(); } }
    else if (act === 'apply-all') { const keep = parsed.filter((p, i) => !applyParsed(i)); parsed = keep; save(); render(); }
    else if (act === 'clear-parsed') { parsed = []; render(); }
    else if (act === 'parse-text') { const t = $('#pasteText').value; if (t.trim()) { parsed.push(toParsed('貼り付けテキスト', P.parseText(t))); render(); } }
    else if (act === 'fill-dep') { const c = result.withholdingCount; e.payroll.salary.forEach((r) => { if (r.gross !== '') r.depCount = c; }); save(); render(); }
    else if (act === 'write-adj') {
      const idx = [...e.payroll.salary.keys()].reverse().find((i) => e.payroll.salary[i].gross !== '') ?? 11;
      e.payroll.salary.forEach((r) => { r.adj = ''; }); e.payroll.salary[idx].adj = result.yearEndAdjustment; save(); render();
    } else if (act === 'clear-overrides') { e.overrides = {}; save(); render(); }
    else if (act === 'print') window.print();
    else if (act === 'excel') await exportExcel(e);
    else if (act === 'excel-all') { for (const x of state.employees) await exportExcel(x); }
    else if (act === 'backup') download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), `年末調整_バックアップ_${new Date().toISOString().slice(0, 10)}.json`);
    else if (act === 'wipe') { if (confirm('このブラウザに保存した全従業員のデータを削除しますか？（元に戻せません）')) { state = { employees: [], currentId: null }; save(); render(); } }
    else if (act === 'export-list') {
      const head = ['氏名', '⑦給与等', '⑧徴収済税額', '㉑所得控除', '㉒課税給与所得', '㉖年調年税額', '区分', '㉗過不足額', '確定申告要確認'];
      const rows = state.employees.map((x) => { const r = N.calculate(x), L = r.lines; return [x.profile.name, L.r7, L.r8, L.r21, L.r22, L.r26, r.statusLabel, L.r27, r.kakuteiRequired ? '要確認' : '']; });
      const csv = [head, ...rows].map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
      download(new Blob(['﻿' + csv], { type: 'text/csv' }), '年末調整_一覧_令和8年分.csv');
    }
  });

  // 入力 → 状態に反映 → 再計算（再描画せずに出力欄だけ更新してフォーカスを保つ）
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset.parsed !== undefined) {
      const p = parsed[+el.dataset.parsed]; const k = el.dataset.k;
      p[k] = ['payDate', 'kind'].includes(k) ? el.value : el.value === '' ? null : N.num(el.value);
      return;
    }
    if (!el.dataset.bind || !emp()) return;
    const t = el.dataset.type;
    let v = el.value;
    if (t === 'num') v = v.trim() === '' ? '' : N.num(v);
    if (t === 'bool') v = el.checked;
    if (t === 'select' && el.dataset.bind === 'jutaku.rate') v = Number(v);
    setPath(emp(), el.dataset.bind, v);
    emp().updatedAt = new Date().toISOString();
    save();
    if (el.dataset.bind === 'profile.name') renderTabs();
    recompute();
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.id === 'empSelect') { state.currentId = el.value; save(); render(); return; }
    if (el.id === 'restoreFile' && el.files[0]) {
      el.files[0].text().then((txt) => {
        try { const s = JSON.parse(txt); if (!Array.isArray(s.employees)) throw new Error('形式が違います'); state = s; save(); render(); alert(`${s.employees.length}名分を読み込みました`); }
        catch (err) { alert('読み込めませんでした：' + err.message); }
      });
      return;
    }
    if (el.dataset.bind && (el.dataset.type === 'select' || el.dataset.type === 'bool') && ['fuyo', 'kiso'].includes(tab)) render();
  });
  document.addEventListener('focusout', (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.type === 'num' && el.value !== '') el.value = fmtIn(N.num(el.value));
  });

  if (!state.currentId && state.employees[0]) state.currentId = state.employees[0].id;
  render();
})();
</script>
</body>
</html>
