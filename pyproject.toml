[project]
name = "dm-agent"
version = "0.1.0"
description = "BtoB digital marketing AI agent with an in-house MA (SATORI-style feature set): lead capture, scoring, nurturing, sales handoff, UTM, Instagram planning, funnel analysis"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
dev = ["pytest>=7"]

[project.scripts]
dm-agent = "dm_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
